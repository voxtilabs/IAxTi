# OWASP ZAP contra staging (#81). NO corre en cada PR: un escaneo activo
# tarda y golpea un entorno real. Va agendado y a mano, y si no hay URL de
# staging configurada se salta diciéndolo — jamás reporta un verde vacío.
#
# Historial de lo que encontró, para no re-analizarlo cada vez:
#  · 1ª corrida (14-09): 61 pass, 0 fail, 5 warn — todo cabeceras ausentes.
#    Arregladas en la app y no solo en Cloudflare (PR #171), porque la API
#    también responde a quien no pasa por el borde.
#  · 2ª corrida: 65 pass, 0 fail, 1 warn — y ese warn es el inverso del
#    anterior: ZAP marca "contenido no almacenable", que para una API con
#    `no-store` es exactamente lo correcto. Ignorado con su motivo.
name: zap

on:
  schedule:
    # Lunes temprano: el hallazgo llega con la semana por delante.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'URL a escanear (por defecto, la de staging)'
        required: false

permissions:
  contents: read
  # El informe se publica como issue; sin este permiso el paso falla con
  # "Resource not accessible by integration" aunque el escaneo salga limpio.
  issues: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay a quién escanear?
        id: destino
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          URL="${{ github.event.inputs.target }}"
          URL="${URL:-$STAGING_URL}"
          if [ -z "$URL" ]; then
            echo "Sin STAGING_URL configurada: no hay nada que escanear." >> "$GITHUB_STEP_SUMMARY"
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            # La API no tiene raíz (404 a propósito): el spider arranca en
            # /health, que sí responde, y desde ahí recorre igual.
            echo "url=${URL%/}/health" >> "$GITHUB_OUTPUT"
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

      # Baseline: pasivo. No ataca, no crea datos, no borra nada.
      - name: ZAP baseline
        if: steps.destino.outputs.correr == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.destino.outputs.url }}
          rules_file_name: .zap/rules.tsv
          # El nombre por defecto (`zap_scan`) lo rechaza el backend nuevo de
          # artefactos y tumba el job con el escaneo ya terminado y limpio.
          artifact_name: zap-baseline
          # El informe se sube como issue para que quede rastro y no se
          # pierda en los logs de una corrida vieja.
          allow_issue_writing: true
          fail_action: false
