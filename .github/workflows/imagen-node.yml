# Espeja en GHCR el Node que construye la imagen del producto (#765).
#
# ## Por qué, si el Dockerfile ya no parte de Docker Hub
#
# Porque parte de `public.ecr.aws`, que es el registro cuyo cupo anónimo rompió
# el CI el 12-10 (#877): tres `toomanyrequests: Data limit exceeded` seguidos
# bajando redis. No tiene el cupo de Docker Hub — tiene el suyo.
#
# Y acá el costo es peor que un PR rojo. `build.yml` publica la imagen que
# corre en staging y en producción, y `release.yml` promueve la del commit
# EXACTO que se taguea: un cupo agotado deja sin imagen, y eso se descubre
# cuando alguien quiere desplegar.
#
# ## Y la frecuencia no era la que yo suponía
#
# Supuse que los builds eran bastante menos que las corridas de CI, así que la
# exposición sería menor. Medido sobre la última semana: **18 builds contra 33
# corridas de CI** el día pico, y 17 contra 18 el siguiente. Son comparables.
#
# ## El costo que esto sí tiene
#
# La imagen de GHCR es privada, así que `docker compose build` en una máquina
# local necesita `docker login ghcr.io` una vez —con un token con `read:packages`—.
# Es una molestia real y se asume a cambio de que el deploy no dependa de un
# cupo que fija alguien más. Si algún día el paquete se hace público, la
# molestia desaparece sin tocar nada de esto.
#
# ## Cuándo corre
#
# Semanal, a mano, y cuando cambia este archivo. Igual que los de Postgres y
# Redis, y por el mismo motivo que ésos explican: la imagen tiene que EXISTIR
# antes de que el Dockerfile le apunte.
#
# Si aparece un cuarto espejo, es hora de generalizar los tres en uno. Con tres
# la repetición es más legible que la abstracción.
name: imagen-node

on:
  schedule:
    # Lunes temprano, después de los otros dos: `node:22-alpine` es una
    # etiqueta móvil y recibe parches de seguridad de Alpine.
    - cron: '57 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/imagen-node.yml

concurrency:
  group: imagen-node
  cancel-in-progress: true

jobs:
  espejar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # Etiqueta móvil como las otras del repositorio, con su motivo en #758.
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `pull` + `tag` + `push`, sin Dockerfile: es la MISMA imagen oficial en
      # otro registro. Una capa vacía arriba sería una pieza más que mantener.
      - name: Copiar node a GHCR
        env:
          ORIGEN: public.ecr.aws/docker/library/node:22-alpine
          DESTINO: ghcr.io/voxtilabs/node:22-alpine
        run: |
          set -euo pipefail
          docker pull "$ORIGEN"
          docker tag "$ORIGEN" "$DESTINO"
          docker push "$DESTINO"

      - name: Comprobar que la copia CORRE
        env:
          DESTINO: ghcr.io/voxtilabs/node:22-alpine
        run: |
          set -euo pipefail
          # Lo que la imagen HACE y no que el push terminó: una copia que no
          # arranca dejaría el build fallando en el primer `RUN`, lejos de acá.
          version=$(docker run --rm "$DESTINO" node --version)
          echo "node: $version"
          # Y que la versión sea la que el Dockerfile espera: un `node:22` que
          # viniera con 20 compilaría distinto sin que nadie lo note.
          case "$version" in
            v22.*) ;;
            *) echo "El espejo trajo $version y el Dockerfile espera v22."; exit 1 ;;
          esac
          # pnpm se instala sobre esta imagen en el primer RUN: que npm ande.
          docker run --rm "$DESTINO" npm --version >/dev/null
          {
            echo "## Node del build"
            echo ""
            echo "- Imagen: \`$DESTINO\`"
            echo "- Versión: **$version**"
          } >> "$GITHUB_STEP_SUMMARY"
