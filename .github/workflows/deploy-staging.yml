# Migraciones en Supabase staging (con lock, ANTES del deploy) y deploy vía
# API de Dokploy a través de Cloudflare Access. La imagen se fija por SHA del
# commit: `docker compose up` solo recrea cuando la referencia cambia, así
# cada deploy es exactamente este commit (SPEC §37).
# Secrets (environment "staging"): DATABASE_URL_STAGING (dueño, migra),
#   DATABASE_URL_APP_STAGING (rol de la aplicación, #370), DOKPLOY_URL,
# DOKPLOY_API_KEY, CF_ACCESS_CLIENT_ID/SECRET, DOKPLOY_COMPOSE_ID_STAGING,
# STAGING_BASE_URL.
name: deploy-staging

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

# Un despliegue a la vez, y gana el ÚLTIMO commit.
#
# Cada merge a main dispara uno, y las esperas son largas a propósito (hasta
# 15 min por Dokploy y 12 más por el /health, #254). Con varios PR seguidos se
# apilan: llegué a ver dos corriendo a la vez contra el mismo stack, y el que
# empezó primero termina haciéndole el smoke test al despliegue del otro —
# reporta verde o rojo sobre algo que no es lo que él desplegó.
#
# `cancel-in-progress` y no una cola, porque encolar cuatro despliegues son
# dos horas para terminar poniendo el mismo commit. Desplegar uno viejo es
# peor que cancelar.
#
# Cancelar es seguro, comprobado antes de ponerlo: cada migración corre en su
# propia transacción y se registra en `schema_migrations`, así que la que iba
# a medias hace rollback y la próxima corrida sigue donde quedó. El
# `pg_advisory_lock` se libera solo cuando muere la conexión del runner.
concurrency:
  group: deploy-staging
  # NO se cancela el que va (#598). `cancel-in-progress: true` es correcto para
  # CI —no tiene sentido seguir compilando un commit que ya quedó viejo— y es
  # EQUIVOCADO para un despliegue: un deploy no se puede abortar a medias.
  #
  # Pasó el 26/09. Dos merges seguidos encolaron dos deploys del mismo commit; el
  # segundo canceló al primero justo después de `compose.deploy`, así que Dokploy
  # quedó a mitad de recrear el stack: Traefik vivo con su certificado y ningún
  # backend detrás. Los tres hostnames de staging devolviendo 404 y 503.
  #
  # En cola, el segundo espera y vuelve a desplegar el mismo commit — que es
  # idempotente, porque la imagen se fija por SHA. Tarda más y no rompe nada.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    # Staging se despliega desde la rama `staging`, no desde main (ADR-0019).
    # Sin esta condición, cada promoción a main redesplegaría staging con lo
    # mismo que ya tiene, y peor: pisaría lo que se esté probando ahí.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'staging') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar herramientas del despliegue
        run: pnpm install --frozen-lockfile

      - name: Migraciones (antes del deploy, nunca en el contenedor)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "Sin DATABASE_URL_STAGING aún; se salta"; exit 0; fi
          pnpm run migrate:deploy

      # Después de migrar y ANTES de desplegar (#370): una migración nueva
      # trae tablas que el rol de la aplicación todavía no puede tocar, y
      # eso no se ve hasta que un mensaje de verdad falla con "permission
      # denied". Acá se ve en el paso, con el nombre de la tabla.
      #
      # Sin DATABASE_URL_APP_STAGING el paso avisa y sigue: mientras la
      # aplicación use el rol dueño no hay nada que comprobar — lo que falta
      # ahí es el cambio de rol, no este paso.
      - name: Permisos del rol de la aplicación
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_APP_STAGING }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::Sin DATABASE_URL_APP_STAGING: la aplicación sigue conectando con el rol dueño (#370)."
            exit 0
          fi
          pnpm --filter @iaxti/db run build
          pnpm --filter @iaxti/db run permisos

      - name: Deploy en Dokploy (imagen fijada al SHA del commit)
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID_STAGING }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Para comprobar QUÉ imagen quedó viva antes de dar el deploy por bueno
          # (#652). El Smoke la usa por su cuenta; acá hace falta porque forzar la
          # recreación necesita las dos cosas a la vez: la URL pública y las
          # credenciales de Dokploy, y el Smoke a propósito no tiene las segundas.
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "${DOKPLOY_URL}" ]; then echo "Sin Dokploy configurado aún; se salta"; exit 0; fi
          auth=(-H "x-api-key: ${DOKPLOY_API_KEY}" -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")

          # Si Dokploy no contesta, decirlo ASÍ y no con `curl: (22)` (#598).
          #
          # El 26/09 el deploy murió acá con «curl: (22) The requested URL
          # returned error: 502» y nada más. Ese 22 es el código de salida de
          # curl, no una explicación: quien lo lee no sabe si se cayó Dokploy, si
          # cambió la URL o si Cloudflare Access rechazó las credenciales. Y el
          # trabajo de #571 no ayudó, porque solo cubría la ESPERA — esta llamada
          # es antes.
          if ! compose_actual=$(curl -fsS "${auth[@]}" "${DOKPLOY_URL}/api/compose.one?composeId=${COMPOSE_ID}" 2>&1); then
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" \
              "${DOKPLOY_URL}/api/compose.one?composeId=${COMPOSE_ID}" 2>/dev/null || echo '000')
            echo "No se pudo hablar con Dokploy (HTTP ${codigo})."
            case "$codigo" in
              502|503|504)
                echo "Su API está caída o reiniciando. El stack que ya corre NO se toca:"
                echo "esto falla antes de tocar nada, así que staging sigue como estaba."
                echo "Hay que revivir Dokploy en el VPS; lo primero a mirar es el disco."
                ;;
              401|403)
                echo "Dokploy responde pero rechaza las credenciales: revisa DOKPLOY_API_KEY"
                echo "y las dos de Cloudflare Access."
                ;;
              000)
                echo "Ni siquiera hubo respuesta: DNS, red o la URL cambió."
                ;;
              *) echo "Respondió algo inesperado. El cuerpo no se imprime: puede traer entorno." ;;
            esac
            exit 1
          fi
          env_actual=$(printf '%s\n' "$compose_actual" | jq -r '.env')
          env_nuevo=$(printf '%s\n' "$env_actual" | sed "s|^IMAGE=.*|IMAGE=ghcr.io/voxtilabs/iaxti:${SHA}|")
          # GLM (ADR-0025): la llave viaja como secreto de GitHub y el deploy
          # la SIEMBRA en el env de Dokploy si falta — así ningún humano la
          # pega en el panel. Si ya está, manda la del panel (el operador
          # puede haberla rotado ahí).
          if [ -n "${GLM_API_KEY}" ] && ! printf '%s\n' "$env_nuevo" | grep -q '^GLM_API_KEY='; then
            env_nuevo=$(printf '%s\nGLM_API_KEY=%s' "$env_nuevo" "${GLM_API_KEY}")
          fi
          # Raw no toma los cambios del YAML versionado (#396). Completar solo
          # los checks ausentes, preservando la configuración del operador.
          # El documento puede contener secretos: archivo privado, nunca logs.
          umask 077
          parche_health=$(mktemp)
          trap 'rm -f "$parche_health"' EXIT
          printf '%s\n' "$compose_actual" | node scripts/sincronizar-healthchecks.mjs \
            infra/dokploy/docker-compose.staging.yml > "$parche_health"
          jq -n --arg id "$COMPOSE_ID" --arg env "$env_nuevo" --slurpfile health "$parche_health" \
            '{composeId:$id, env:$env} + $health[0]' \
            | curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/json" -d @- \
              "${DOKPLOY_URL}/api/compose.update" >/dev/null
          echo "IMAGE=ghcr.io/voxtilabs/iaxti:${SHA}"

          curl -fsS -X POST "${auth[@]}" -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${COMPOSE_ID}\"}" "${DOKPLOY_URL}/api/compose.deploy" >/dev/null

          # La espera vive en un script porque hay que poder probarla (#571):
          # dentro de un `run:` de cuarenta líneas no se puede, y la primera
          # versión de esto tenía una rama sin cubrir — la del timeout, que es
          # justo la que se estrenó.
          ESPERA_DEPLOY_SEG=${ESPERA_DEPLOY_SEG:-900} bash scripts/esperar-deploy.sh

          # Y si aun así el contenedor no tomó la imagen, se fuerza (#652).
          # Dokploy dice «done» en 11 s y con sourceType raw no recrea nada.
          # Va acá y no en el Smoke porque necesita las credenciales de Dokploy,
          # y el Smoke a propósito no las tiene.
          BASE="${STAGING_BASE_URL}" bash scripts/forzar-recreacion.sh

      - name: Smoke
        env:
          BASE: ${{ secrets.STAGING_BASE_URL }}
          # SHA va acá también (#613). Estaba SOLO en el env del paso Deploy, y
          # este es otro paso: la comprobación de «qué build quedó vivo» que
          # agregué en #566 nunca corrió. Imprimía «Sin SHA en el entorno» en
          # cada despliegue y nadie lo leyó, porque la rama que salta cuando no
          # hay SHA la puse yo para que las pruebas no dieran un rojo sin
          # sentido — y se tragó la comprobación entera en producción.
          #
          # Declarado en un lado, aplicado en ninguno, otra vez, y esta vez mío.
          SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "${BASE}" ]; then echo "Sin STAGING_BASE_URL aún; se salta"; exit 0; fi

          # Dokploy dice "done" cuando aplicó el compose, no cuando la app
          # atiende. Veinte segundos fijos daban rojos falsos; cuatro minutos
          # también. Medido el 15/09 contra staging: entre el "done" y el
          # primer /health en 200 pasaron unos DIEZ minutos — el tiempo se lo
          # lleva la ruta del proxy, no el arranque de la aplicación.
          # La espera se MIDE, no solo se aguanta (#254). Una espera larga y
          # muda esconde el problema: si mañana la app tarda el doble por un
          # bug, este paso la aguanta igual y nadie se entera. Acá el número
          # queda escrito en cada despliegue y se compara contra un
          # presupuesto declarado.
          PRESUPUESTO_SEG=${PRESUPUESTO_SEG:-300}
          echo "Esperando a que la API y sus dependencias estén listas..."
          inicio=$(date +%s)
          listo=no
          # Se espera al BUILD NUEVO, no a «un 200» (#643).
          #
          # Esperar un 200 no sirve: el contenedor VIEJO lo contesta
          # perfectamente hasta que el nuevo lo reemplaza. El 27/09 la espera
          # terminó en 1 s, el smoke comparó el SHA contra la imagen anterior y
          # el despliegue quedó rojo — estando bien. Un rojo en un deploy sano
          # es peor que no tener la comprobación: enseña a ignorar los rojos, y
          # justamente esta caza el caso de #573.
          #
          # Y de paso arregla la medición de #254: la «ventana sin atender»
          # decía 1 s siempre, porque medía hasta que alguien contestaba y no
          # hasta que contestaba el build desplegado. Un número que siempre da
          # lo mismo no está midiendo.
          for i in $(seq 1 72); do
            # /health puede responder mientras la base todavía conecta (#17,
            # #254). Esperar readiness; una caída persistente sigue fallando.
            codigo=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' "${BASE}/ready" || true)
            if [ "$codigo" = "200" ]; then
              # Sin SHA en el entorno este paso corre de verdad en una prueba y
              # no hay commit desplegado contra el cual comparar: ahí vale el
              # comportamiento viejo, o la espera no terminaría nunca.
              if [ -z "${SHA:-}" ]; then listo=si; break; fi
              atiende=$(curl -sS -m 10 "${BASE}/health" | jq -r '.sha // empty')
              # Prefijo, no igualdad: /health informa el SHA corto.
              if [ -n "$atiende" ] && [ "${SHA#"$atiende"}" != "${SHA}" ]; then
                listo=si; break
              fi
            fi
            sleep 10
          done
          espera=$(( $(date +%s) - inicio ))
          echo "Ventana sin atender: ${espera}s (presupuesto ${PRESUPUESTO_SEG}s)"
          # Fuera de Actions no hay GITHUB_OUTPUT, y este mismo paso se
          # ejecuta de verdad en un test (`smoke-readiness`): redirigir a una
          # ruta vacía aborta el script con `set -e`.
          [ -n "${GITHUB_OUTPUT:-}" ] && echo "ventana_sin_atender_seg=${espera}" >> "$GITHUB_OUTPUT" || true
          if [ "$listo" = "si" ] && [ "$espera" -gt "$PRESUPUESTO_SEG" ]; then
            # Aviso y no error: el despliegue SÍ quedó sano, y fallarlo
            # dejaría staging desplegado con el CI en rojo, que es la peor
            # combinación para leer. Lo que importa es que el número deje de
            # ser invisible.
            echo "::warning::El despliegue tardó ${espera}s en atender, por encima de los ${PRESUPUESTO_SEG}s de presupuesto (#254)."
          fi
          # `curl -f` que falla solo dice el código. Cuando la API no arranca,
          # el proxy contesta un 404 pelado y ese 404 no explica nada: el
          # 15/09 costó una hora de apuestas a ciegas. Acá se imprime SIEMPRE
          # el cuerpo —el "404 page not found" de Traefik no se parece en
          # nada al de la app— y el host al que se está pegando.
          echo "Host: $(printf '%s' "${BASE}" | sed -E 's#^https?://([^/]+).*#\1#')"

          mirar() {
            ruta="$1"
            cuerpo=$(curl -sS -m 15 -w '\n%{http_code}' "${BASE}${ruta}" 2>&1) || true
            codigo=$(printf '%s' "$cuerpo" | tail -1)
            echo "--- ${ruta} -> ${codigo}"
            printf '%s\n' "$cuerpo" | head -n -1 | head -c 600
            echo
            [ "$codigo" = "200" ]
          }

          fallo=0
          mirar /health || fallo=1
          # Y que lo que está vivo sea lo que ACABAMOS de desplegar (#565).
          # Dokploy puede decir «done» sobre la imagen anterior —si el pull
          # falló, si el contenedor viejo nunca murió— y hasta ahora eso no se
          # veía: el smoke pasaba porque la app de antes contesta igual de bien.
          # `/health` trae el SHA desde el tag de IAXTI_IMAGE.
          # Sin SHA no hay nada contra qué comparar: este mismo paso se ejecuta
          # de verdad en una prueba, y ahí no hay commit desplegado. Comparar
          # contra la nada y fallar sería un rojo que no significa nada.
          vivo=$(curl -sS -m 15 "${BASE}/health" | jq -r '.sha // empty')
          if [ -z "${SHA:-}" ]; then
            echo "Sin SHA en el entorno: no se verifica qué build quedó vivo."
          elif [ -z "$vivo" ]; then
            # Esto era un aviso y ahora FALLA (#573), porque el aviso se dio
            # justo en el caso que más importa: el despliegue de 34ce61e dijo
            # «done» y staging siguió sirviendo una imagen anterior a #566, que
            # es la que no informa el SHA. Una comprobación de imagen vieja que
            # se calla cuando la imagen es vieja no comprueba nada.
            #
            # Y el smoke no lo puede notar de otra forma: la imagen vieja
            # contesta /health y /ready en 200 perfectamente.
            echo "/health no informa el SHA, así que está corriendo una imagen anterior a #566."
            echo "El deploy dijo que salió bien. Eso es lo que describe #573: revisa qué"
            echo "imagen tiene el contenedor antes de dar este despliegue por bueno."
            fallo=1
          elif [ "${SHA#"$vivo"}" = "${SHA}" ]; then
            echo "Lo que atiende es ${vivo}, y se desplegó ${SHA}."
            echo "El deploy dijo que salió bien pero está corriendo otra imagen."
            fallo=1
          else
            echo "Build vivo: ${vivo} (coincide con el commit desplegado)."
          fi
          mirar /health/modules || fallo=1

          # ¿Quedó este despliegue con IA? (#641)
          #
          # No falla el deploy: que falte una credencial de IA no es motivo para
          # marcar el despliegue en rojo —la bandeja, el CRM y los webhooks
          # siguen sirviendo—, pero SÍ tiene que quedar dicho acá. La pregunta
          # «¿llegó la llave al contenedor?» se volvió una conversación repetida
          # porque no había dónde mirarla: `/ready` decía «ok» con las tres
          # ausentes. `/ready` no publica nombres ni llaves, solo cuántas hay;
          # el detalle con el nombre de cada variable pide sesión y vive en
          # /agents/diagnostico.
          ia=$(curl -sS -m 15 "${BASE}/ready" | jq -r '.dependencias[]? | select(.nombre=="ia") | "\(.ok)|\(.detalle)"')
          case "${ia%%|*}" in
            true)  echo "IA: ${ia#*|}" ;;
            false) echo "IA SIN CREDENCIAL: ${ia#*|}" ;;
            *)     echo "IA: esta imagen todavía no informa el estado de la IA en /ready." ;;
          esac

          # ¿Con qué llave quedó el canal? (#669)
          #
          # Una `zv_test_` solo alcanza a los números del equipo en el proveedor,
          # así que el producto parece roto —«no llegó»— cuando el ambiente solo
          # está en sandbox. Dos veces en un día se perdieron horas adivinando si
          # el cambio de variable había entrado; acá queda dicho en cada deploy.
          canal=$(curl -sS -m 15 "${BASE}/ready" | jq -r '.dependencias[]? | select(.nombre=="canal") | .detalle' 2>/dev/null || true)
          if [ -n "$canal" ]; then echo "Canal: ${canal}"; fi
          # `/ready` SÍ mira las dependencias: una API viva sin base contesta
          # /health en 200 y no sirve para nada. Sin esto, un despliegue con
          # la base inalcanzable se declaraba bueno — y así estuvo staging.
          mirar /ready || fallo=1
          if [ "$fallo" != "0" ]; then
            echo "El despliegue quedó arriba pero no sano: los cuerpos de arriba dicen por qué."
            exit 1
          fi
