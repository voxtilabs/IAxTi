# CI base (SPEC §37, primer tramo del pipeline): lint → typecheck → build.
# Todo bloqueante. Los tramos siguientes (dependency-cruiser, tests,
# combinación de módulos, CodeQL, Gitleaks, Trivy) se agregan con sus issues.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Ninguna imagen sale de Docker Hub (#760).
    #
    # Docker Hub limita las descargas anónimas por IP y las IP de los runners
    # son compartidas: cuando el cupo se agota, el job muere en «Initialize
    # containers» con `toomanyrequests`, sin una línea de log de pruebas y sin
    # nada que apunte a la causa. El 09-10 dejó cinco PR trancados a la vez, y
    # el reintento caía en lo mismo.
    #
    #  - **Postgres**: la construimos nosotros desde la oficial de AWS y la
    #    publicamos en GHCR (`imagen-postgres-ci.yml`). La imagen de la
    #    comunidad `pgvector/pgvector` vive solo en Docker Hub, y espejarla no
    #    sirve: copiarla ES una descarga de Docker Hub, así que el espejo se cae
    #    por lo mismo que vino a arreglar. Medido.
    #  - **Redis**: es una imagen OFICIAL, y AWS espeja las oficiales en
    #    `public.ecr.aws/docker/library/*` sin ese cupo. Un espejo propio de
    #    algo ya espejado sería una pieza más por nada.
    #
    # **Ningún `services:` sin credenciales**, aunque sea una imagen oficial,
    # aunque sea chica y aunque el registro no sea Docker Hub: el cupo lo
    # comparte el job entero, y un cupo anónimo lo fija alguien que no somos
    # nosotros. Decía «no vuelvas a apuntar a Docker Hub» y eso dejó pasar ECR
    # público, que tiene su propio cupo y lo agotó el 12-10 (#877).
    services:
      postgres:
        image: ghcr.io/voxtilabs/postgres-pgvector:16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: iaxti
          POSTGRES_PASSWORD: iaxti
          POSTGRES_DB: iaxti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iaxti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis también sale de NUESTRO espejo (#877), y el camino hasta acá vale
      # contarlo porque la lección no es la que parecía.
      #
      # #760 lo había puesto en `public.ecr.aws/docker/library/redis:7-alpine`
      # con este argumento: «es una imagen OFICIAL y las oficiales están en
      # ECR público, que permite descargas anónimas SIN EL CUPO DE DOCKER HUB.
      # Mantener un espejo propio de algo ya espejado sería una pieza más por
      # nada». Razonable, y con la premisa equivocada: ECR público no tiene el
      # cupo de Docker Hub, tiene el suyo. El 12-10 lo agotó y el CI del PR que
      # arreglaba la velocidad de la IA murió acá:
      #
      #   docker pull public.ecr.aws/docker/library/redis:7-alpine
      #   Error response from daemon: toomanyrequests: Data limit exceeded
      #
      # Postgres bajó bien en el mismo job, porque sale de GHCR autenticado.
      #
      # Así que lo que de verdad se aprendió, y es lo que cuida la guarda de
      # `tests/los-servicios-del-ci.test.ts`: **no dependas de un cupo anónimo
      # que no controlás**, venga del registro que venga.
      redis:
        image: ghcr.io/voxtilabs/redis-ci:7
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://iaxti:iaxti@127.0.0.1:5432/iaxti
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      # `fetch-depth: 0` por Semgrep (#756): compara contra la base del PR para
      # bloquear SOLO lo que el PR introduce, y para eso necesita el commit base
      # en el clon. Con el clon de un commit —el defecto— ese commit no existe y
      # la comparación no se puede hacer.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.4.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache de Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency-cruiser (fronteras de módulos)
        run: pnpm depcruise

      # Las guardas que solo leen archivos, acá y no solo en el preflight.
      #
      # Esto se agregó por un caso concreto: la lista base de #788 entró a
      # staging DESACTUALIZADA por uno. La generé, después un rebase trajo un
      # `catch` nuevo de otro PR, y la lista quedó corta — y CI no lo vio,
      # porque estas guardas vivían solo en `antes-de-empujar.sh`. Una guarda
      # que no corre en CI la saltea cualquier PR que no corra el preflight
      # después de rebasar, que es justo cuando el total cambia.
      #
      # Son segundos: no tocan base ni red, solo escanean el repo.
      - name: Guardas de pantalla (respuestas, avisos, negocio)
        run: |
          node scripts/respuestas-sin-mirar.mjs
          node scripts/avisos-sin-rastro.mjs
          node scripts/el-negocio-se-sigue.mjs

      # ADR-0008: prohibido condicionar por rol; el único traductor
      # rol → permisos es domain/base-roles.ts del módulo authorization.
      #
      # Caza `===` Y `!==` (#532). Solo miraba `===`, así que
      # `actor.role !== 'ADMIN'` pasó sin que nadie lo viera — y era una
      # comparación por nombre que no veía un rol propio del negocio con más
      # permisos que quien invitaba.
      #
      # Saca los comentarios antes de buscar: un comentario que CITA el código
      # viejo para explicar por qué se cambió no es una condicional por rol.
      # Con el grep a secas, documentar el defecto hacía fallar el PR que lo
      # arreglaba.
      #
      # Las dos exentas van por su EXPRESIÓN exacta y no por archivo: exentar
      # `application/tags.ts` entero dejaba pasar cualquier condicional por rol
      # que alguien agregue después en ese archivo — y el comodín además cubría
      # cualquier `application/tags.ts` de cualquier paquete.
      #
      # `typeof role !== 'string'` del guard es una comprobación de tipo, y
      # `input.role !== undefined` de tags es el rol VISUAL de una etiqueta
      # (good/warn/bad), que no tiene nada que ver con permisos.
      - name: Sin condicionales por rol
        run: |
          encontrados=$(grep -rn --include='*.ts' -E "\brole\b *(===|!==)" apps packages \
            | grep -v 'domain/base-roles' \
            | grep -vE '^\s*[^:]+:[0-9]+:\s*(//|\*|/\*)' \
            | grep -v "typeof role !== 'string'" \
            | grep -v "input.role !== undefined" || true)
          if [ -n "$encontrados" ]; then
            echo "$encontrados"
            echo "Prohibido condicionar por rol fuera de base-roles.ts (ADR-0008)."
            echo "Compara PERMISOS: mira apps/api/src/equipo-usuarios.controller.ts"
            exit 1
          fi
          echo "sin condicionales por rol"

      - name: Build
        run: pnpm build

      # Unit + integración (Postgres y Redis reales) + combinación de módulos.
      # Concurrencia 1: los paquetes comparten la base del servicio.
      #
      # `turbo` corre las tareas con un entorno ESTRICTO: hasta que
      # DATABASE_URL y REDIS_URL se declararon en `passThroughEnv` (turbo.json),
      # los tests corrían SIN base y todo lo que dependía de ella se saltaba
      # en silencio. Eso escondió dos bugs reales —un 500 en producción por
      # un tenant con id inválido (issue 162) y el día en UTC del tablero
      # (issue 182)— que solo aparecieron al correr los tests a mano.
      #
      # Que eso no vuelva a pasar lo vigila `packages/db/tests/entorno.test.ts`,
      # y no un paso de CI: un paso que mira la base DESPUÉS da falso
      # positivo cuando turbo sirve los tests desde caché (en un PR de solo
      # documentación no corre nada y la base queda vacía).
      - name: Tests
        run: pnpm turbo test --concurrency=1

      # Las guardas de esquema de `packages/db`, FUERA de turbo y a propósito.
      #
      # `packages/db` no depende de ningún módulo, así que turbo no ve sus
      # migraciones como entrada: cuando un PR agrega una tabla en otro
      # paquete, sus tests se sirven desde caché y las guardas se saltan justo
      # en el único caso que existen para vigilar. Pasó de verdad —
      # `agent_goal_attempts` entró a main sin inventariar y el rojo apareció
      # recién en el PR siguiente.
      #
      # Va TODO el paquete y no un archivo suelto. La primera versión de esto
      # corría solo `inventario.test.ts`, y al PR siguiente saltó
      # `exportacion.test.ts` con exactamente el mismo problema y la misma
      # tabla: elegir los archivos a mano es volver a mantener una lista que
      # se desincroniza. Estos tests leen el esquema vivo; ninguno se puede
      # cachear contra las entradas de su propio paquete.
      #
      # Corre contra la base que los tests de arriba ya migraron.
      - name: Guardas de esquema (sin caché)
        run: pnpm --filter @iaxti/db exec vitest run


      # Guardas de `packages/core`, FUERA de turbo y por el mismo motivo.
      #
      # `variables-del-despliegue.test.ts` escanea `apps/` y `packages/`
      # enteros y compara contra los dos compose de `infra/`. Nada de eso es
      # entrada de `@iaxti/core` para turbo: un PR que agregue
      # `process.env.NUEVA` en el módulo de pagos se sirve desde caché y la
      # guarda no corre justo en el PR que la necesitaba.
      #
      # Va todo el paquete y no el archivo suelto: elegir archivos a mano es
      # volver a mantener una lista que se desincroniza (pasó con las
      # guardas de esquema, ver arriba). Core corre en ~4 s y no necesita
      # base.
      # También rutas-frontend.test.ts (#360): cruza web/admin y controllers.
      # Se ejecuta aquí incluso cuando turbo recupera core desde caché.
      - name: Guardas de despliegue y rutas (sin caché)
        run: pnpm --filter @iaxti/core exec vitest run


      # Criterio de salida de Fase 2 (#37): el e2e de la bandeja en celular
      # contra la API y el web reales (JWKS local hace de Supabase Auth).
      - name: E2E bandeja (Playwright, celular)
        run: |
          pnpm --filter @iaxti/web exec playwright install --with-deps chromium
          node apps/web/e2e/run-e2e.mjs

      # #56 usa otro JWKS, proveedor HTTP sintético, worker y rol RLS.
      # No se recoge con la fixture de Bandeja; este paso es obligatorio.
      - name: E2E invitación partner (API, worker y custodia sintética)
        env:
          DATABASE_URL: postgres://iaxti:iaxti@127.0.0.1:5432/iaxti_test_partner_e2e
          APP_DATABASE_URL: postgres://iaxti_app:iaxti_app@127.0.0.1:5432/iaxti_test_partner_e2e
          REDIS_URL: redis://127.0.0.1:6379/10
        run: pnpm --filter @iaxti/web e2e:partner

      # La traza del fallo, que hasta ahora moría con el runner (#682).
      #
      # El log del paso de arriba nombra el archivo —`trace.zip`— y hasta imprime
      # el comando para abrirlo, y el archivo no existía en ninguna parte:
      # `gh run download` contestaba «no valid artifacts found». Un e2e que solo
      # falla en CI y no deja evidencia se «arregla» adivinando, que es la peor
      # forma de trabajar: se toca código que probablemente esté bien y se
      # vuelven a esperar ocho minutos.
      #
      # Solo si falló: en verde son decenas de MB por corrida que nadie va a
      # mirar. Y con retención corta, porque una traza sirve el mismo día.
      - name: Traza del e2e cuando falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traza-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # El dataset de regresión de agentes (#53): con el secret presente
      # corre de verdad y BLOQUEA si el score baja del baseline versionado;
      # sin secret avisa y se salta — jamás inventa un score.
      - name: Evals de agentes (dataset de regresión)
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: pnpm --filter @iaxti/module-agents exec node scripts/run-evals.mjs

      # Los workflows se revisan a sí mismos (#770).
      #
      # Un `needs:` a un job que no existe, un `runs-on` mal escrito, una
      # expresión que nombra algo no declarado: nada de eso se ve hasta que el
      # job corre, y entonces ya se gastaron doce minutos. `actionlint` lo ve en
      # 17 ms.
      #
      # El binario se baja de las releases y NO se usa la acción oficial: esa
      # corre en un contenedor de Docker Hub, y meter esa dependencia de vuelta
      # sería deshacer #760 y #765 por comodidad.
      - name: Workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint

      # Análisis estático de seguridad (#81). Corre en CADA PR y BLOQUEA:
      # un hallazgo de seguridad que solo avisa se ignora a la tercera vez.
      # El ruleset es el de OWASP + TypeScript de la propia Semgrep.
      #
      # El CLI por pip y NO `semgrep/semgrep-action@v1` (#756).
      #
      # Esa acción corre dentro del contenedor `returntocorp/semgrep-agent:v1`,
      # que sale de Docker Hub SIN AUTENTICAR. Docker Hub limita las descargas
      # anónimas por IP y las IP de los runners son compartidas, así que cuando
      # el cupo se agota el job muere en «Pull returntocorp/semgrep-agent:v1»:
      #
      #   Error response from daemon: toomanyrequests: You have reached your
      #   unauthenticated pull rate limit.
      #
      # Sin una línea de log de pruebas, sin nada que leer, y el PR rojo por
      # algo que no tiene ninguna relación con su diff. Pasó cuatro veces
      # seguidas el 09-10 y dejó #755 y #757 trancados. El reintento no es
      # remedio ni diagnóstico: vuelve a caer en la misma, y lo que enseña es a
      # apretar «rerun» ante cualquier rojo — el hábito justo que las guardas de
      # este repo existen para evitar.
      #
      # `semgrep` es un paquete de Python y el runner ya trae Python: instalarlo
      # saca el contenedor de la ecuación y con él el cupo. La acción además
      # está marcada como obsoleta por Semgrep, que recomienda el CLI.
      #
      # ## Por qué vuelve a mirar el ÁRBOL COMPLETO
      #
      # Durante un tiempo esto comparaba contra la base del PR, y el motivo
      # estaba escrito acá: la acción `:v1` congelaba un semgrep de hace años,
      # los packs crecieron, y con el CLI de hoy los mismos tres encontraban
      # **27 hallazgos preexistentes**. Bloquear esos 27 en el PR que venía a
      # desatascar el CI habría sido cambiar un rojo que no habla del cambio por
      # otro, así que se bloqueó solo lo que cada PR INTRODUCE y los 27 se
      # fueron a su issue (#758) con la lista.
      #
      # Ya no quedan. Medido con los tres packs sobre el árbol completo:
      #
      #     27  cuando se escribió el issue
      #     17  al volver a medirlo — los dos de inyección de shell, el
      #         checkout del workflow_run, el http del script local, el USER
      #         del Dockerfile y el innerHTML del login ya estaban arreglados
      #      3  tras encender las defensas de pnpm (#992)
      #      0  tras fijar las veinte acciones a su SHA (#993)
      #
      # Así que el `--baseline-commit` sale, que era su propia condición de
      # salida: «mientras queden, se queda». Desde acá un hallazgo en CUALQUIER
      # parte del árbol tumba el job, no solo uno que el PR agregue — que es lo
      # que hace que esto sea una guarda y no un peaje. Y se fue con él el
      # `BASE_DEL_PR`, que era la única razón por la que este paso necesitaba
      # una variable.
      #
      # `--error` conserva lo que importa: sin eso Semgrep informa y devuelve 0,
      # que es la versión que se ignora a la tercera vez.
      - name: Semgrep (SAST)
        run: |
          python -m pip install --disable-pip-version-check --quiet semgrep
          semgrep scan \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            --metrics off \
            --quiet
