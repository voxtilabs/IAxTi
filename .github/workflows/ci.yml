# CI base (SPEC §37, primer tramo del pipeline): lint → typecheck → build.
# Todo bloqueante. Los tramos siguientes (dependency-cruiser, tests,
# combinación de módulos, CodeQL, Gitleaks, Trivy) se agregan con sus issues.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iaxti
          POSTGRES_PASSWORD: iaxti
          POSTGRES_DB: iaxti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iaxti"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://iaxti:iaxti@127.0.0.1:5432/iaxti
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency-cruiser (fronteras de módulos)
        run: pnpm depcruise

      - name: Build
        run: pnpm build

      # Unit + integración (Postgres y Redis reales) + combinación de módulos.
      # Concurrencia 1: los paquetes comparten la base del servicio.
      - name: Tests
        run: pnpm turbo test --concurrency=1
