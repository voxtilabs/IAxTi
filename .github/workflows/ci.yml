# CI base (SPEC §37, primer tramo del pipeline): lint → typecheck → build.
# Todo bloqueante. Los tramos siguientes (dependency-cruiser, tests,
# combinación de módulos, CodeQL, Gitleaks, Trivy) se agregan con sus issues.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Cache de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency-cruiser (fronteras de módulos)
        run: pnpm depcruise

      - name: Build
        run: pnpm build
