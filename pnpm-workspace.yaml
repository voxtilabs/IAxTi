packages:
  - "apps/*"
  - "packages/*"
  - "packages/modules/*"

# pnpm 12 bloquea los build scripts de dependencias salvo lista explícita.
# esbuild lo necesita vitest; scarf es telemetría y queda denegada a propósito.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: true
  msgpackr-extract: set this to true or false
