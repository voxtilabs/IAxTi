packages:
  - "apps/*"
  - "packages/*"
  - "packages/modules/*"

# pnpm 12 bloquea los build scripts de dependencias salvo lista explícita.
# OJO: pnpm appendea placeholders inválidos aquí durante `pnpm install` cuando
# aparece una dep nueva con scripts — revisar este archivo antes de commitear.
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: true
