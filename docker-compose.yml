# Local: postgres + redis + los cinco servicios desde la imagen única.
# `docker compose up` y todos responden /health (SPEC §37: ambiente local).
# Supabase local o proyecto dev personal reemplazan a postgres cuando el
# issue #4 conecte la base real.

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  image: iaxti-local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://iaxti:iaxti@postgres:5432/iaxti
    REDIS_URL: redis://redis:6379
    # Las llaves de los proveedores de IA, POR REFERENCIA: el valor sale del
    # `.env` de la raíz, que docker compose lee solo para sustituir acá.
    #
    # Sin estas líneas, una llave en `.env` no llegaba a ningún contenedor:
    # este compose solo pasaba DATABASE_URL y REDIS_URL, así que
    # `providerAvailable()` daba false para los cuatro y la IA contestaba
    # «no hay proveedor con credencial» con la llave puesta en el archivo
    # (#844). Es la forma de siempre: declarado en un lado, aplicado en
    # ninguno — y acá lo declarado era el `.env`.
    #
    # Cada servicio tiene que LISTAR la variable: heredar el `&app-env` es
    # justo lo que hace que esto alcance para los cinco de una vez.
    GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GLM_API_KEY: ${GLM_API_KEY:-}
    GLM_API_BASE: ${GLM_API_BASE:-https://integrate.api.nvidia.com/v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iaxti
      POSTGRES_PASSWORD: iaxti
      POSTGRES_DB: iaxti
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaxti"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  api:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: api
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  workers:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: workers
    depends_on: [redis]

  agents:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: agents
    depends_on: [redis]

  web:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: web
    ports: ["3002:3000"]

  admin:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: admin
    ports: ["3003:3000"]

volumes:
  pg-data:
  redis-data:
