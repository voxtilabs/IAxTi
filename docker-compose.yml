# Local: postgres + redis + los cinco servicios desde la imagen única.
# `docker compose up` y todos responden /health (SPEC §37: ambiente local).
# Supabase local o proyecto dev personal reemplazan a postgres cuando el
# issue #4 conecte la base real.

x-app: &app
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  image: iaxti-local
  restart: unless-stopped
  environment: &app-env
    # El rol de la APLICACIÓN, no el dueño (#370): sin superusuario y sin
    # BYPASSRLS, igual que staging/prod deben correr. Con el dueño acá, RLS
    # no se evaluaba NUNCA en local y las fugas de aislamiento aparecían
    # disfrazadas de otros errores recién en CI. El dueño (iaxti) queda para
    # migraciones, seed y suites — que limpian y migran, cosa que este rol
    # no puede ni debe.
    DATABASE_URL: postgres://iaxti_app:iaxti_app@postgres:5432/iaxti
    REDIS_URL: redis://redis:6379
    # Las llaves de los proveedores de IA, POR REFERENCIA: el valor sale del
    # `.env` de la raíz, que docker compose lee solo para sustituir acá.
    #
    # Sin estas líneas, una llave en `.env` no llegaba a ningún contenedor:
    # este compose solo pasaba DATABASE_URL y REDIS_URL, así que
    # `providerAvailable()` daba false para los cuatro y la IA contestaba
    # «no hay proveedor con credencial» con la llave puesta en el archivo
    # (#844). Es la forma de siempre: declarado en un lado, aplicado en
    # ninguno — y acá lo declarado era el `.env`.
    #
    # Cada servicio tiene que LISTAR la variable: heredar el `&app-env` es
    # justo lo que hace que esto alcance para los cinco de una vez.
    GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GLM_API_KEY: ${GLM_API_KEY:-}
    GLM_API_BASE: ${GLM_API_BASE:-https://integrate.api.nvidia.com/v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}

services:
  # El Supabase Auth del ambiente local (#1047): firma las sesiones de los
  # usuarios del seed para que una persona entre al panel sin Supabase real.
  # Vive en infra/ (el Dockerfile no lo copia: no hay imagen que lo lleve) y
  # los compose de Dokploy no lo declaran — una guarda muerde si aparece.
  # Efecto lateral deseado: con SUPABASE_JWKS_URL puesta, la API local
  # verifica JWT de verdad y el fallback por cabeceras queda APAGADO.
  auth-local:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    environment:
      PORT: "3004"
      AUTH_ISSUER: http://auth-local:3004/auth/v1
      WEB_ORIGIN: http://localhost:3002
    ports: ["3004:3004"]
    volumes:
      - ./infra/auth-local/server.mjs:/app/server.mjs:ro
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iaxti
      POSTGRES_PASSWORD: iaxti
      POSTGRES_DB: iaxti
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Un volumen nuevo nace con el rol de la aplicación ya creado (#370);
      # en un volumen existente, correr el script del rol una vez a mano
      # (runbook ROL-DE-LA-APLICACION.md).
      - ./infra/sql/rol-de-la-aplicacion.sql:/iaxti/rol-de-la-aplicacion.sql:ro
      - ./infra/sql/local-init-rol.sh:/docker-entrypoint-initdb.d/90-rol-de-la-aplicacion.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iaxti"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  api:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: api
      # El verificador REAL contra auth-local (#1047). Ponerlo apaga además
      # el fallback por cabeceras del guard: en local también se entra con
      # JWT firmado, como en staging/prod.
      SUPABASE_JWKS_URL: http://auth-local:3004/auth/v1/.well-known/jwks.json
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  workers:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: workers
    depends_on: [redis]

  agents:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: agents
    depends_on: [redis]

  web:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: web
      # El SSR habla con la API por la red del compose (#1058): sin esto caía
      # a API_URL_PUBLIC y cada fetch del servidor salía del contenedor hacia
      # el host para volver a entrar — 10,5 s por sección, medido. Es lo
      # mismo que el e2e y staging ya hacían.
      API_URL_INTERNAL: http://api:3000
      # El panel habla con auth-local por el puerto PUBLICADO: estas URLs las
      # usa el NAVEGADOR, no el contenedor. IAXTI_LOGIN_DEV abre /entrar-local
      # — la página además exige que IAXTI_ENV no sea staging/producción.
      SUPABASE_URL: http://localhost:3004
      SUPABASE_ANON_KEY: auth-local
      IAXTI_LOGIN_DEV: "1"
    ports: ["3002:3000"]

  admin:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: admin
      API_URL_INTERNAL: http://api:3000
    ports: ["3003:3000"]

volumes:
  pg-data:
  redis-data:
