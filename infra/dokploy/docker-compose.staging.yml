# iaxti-staging · Dokploy lo importa desde el repo (SPEC §36).
# Imagen única construida en GitHub Actions y publicada en GHCR; el VPS solo
# hace pull. Secrets SOLO como variables de entorno del proyecto en Dokploy:
#   IMAGE, REDIS_PASSWORD, DATABASE_URL (pooler de Supabase staging),
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_JWKS_URL, IAXTI_ENV,
#   SENTRY_DSN, OTEL_EXPORTER_OTLP_* (Grafana Cloud, ADR-0006),
#   KAPSO_API_KEY y KAPSO_WEBHOOK_SECRET (#42).

x-app: &app
  image: ${IMAGE}
  restart: unless-stopped

x-env: &app-env
  IAXTI_ENV: ${IAXTI_ENV}
  SENTRY_DSN: ${SENTRY_DSN}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
  API_URL_INTERNAL: http://api:3000
  API_URL_PUBLIC: ${API_URL_PUBLIC}
  CORS_ORIGINS: ${CORS_ORIGINS}
  # WhatsApp vía Kapso (#42): la cuenta guarda el NOMBRE de la variable
  # (credential_ref), nunca el valor. En sandbox el número es el sandbox.
  KAPSO_API_KEY: ${KAPSO_API_KEY}
  KAPSO_API_BASE: ${KAPSO_API_BASE:-https://api.kapso.ai/meta/whatsapp/v24.0}
  KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET}

services:
  web:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: web
    healthcheck: &hc
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: admin
    healthcheck: *hc

  api:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: api
    healthcheck:
      <<: *hc
      interval: 15s

  workers:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: workers
    depends_on: [redis]

  agents:
    <<: *app
    environment:
      <<: *app-env
      SERVICE: agents
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
