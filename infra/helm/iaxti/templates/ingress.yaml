{{- if .Values.ingress.habilitado }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.habilitado necesita ingress.host: un Ingress sin host no enruta nada." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "iaxti.nombre" . }}
  labels:
    {{- include "iaxti.etiquetas" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "iaxti.nombre" . }}-api
                port: { name: http }
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: {{ include "iaxti.nombre" . }}-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "iaxti.nombre" . }}-web
                port: { name: http }
{{- end }}
