# notifications (#55, SPEC §21): la campana y el correo. Consume los avisos
# del catálogo y respeta las preferencias por usuario y tipo; los críticos
# (número en rojo, impago) no se silencian para el ADMIN.
module:
  id: notifications
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations]
  optional: []
permissions:
  - notifications.manage_own
events:
  publishes: []
  consumes:
    - conversation.unattended
    - sla.first_response_breached
    - note.mentioned
    - activity.due
    - number.quality_changed
    - agent.quota_threshold
    # Estos dos tenían su consumidor y no estaban declarados (issue 273):
    # el manifiesto es de donde sale el catálogo, así que un evento sin
    # declarar es un consumidor que nadie sabe que existe.
    - payment.received
    - tenant.state_changed
    - tenant.deletion_warned
tools: []
# La página existe desde #55 y no se llegaba a ella por ningún lado: no
# estaba en ningún `nav` ni enlazada desde otra pantalla. Trabajo terminado
# que nadie podía usar.
nav:
  - { label: Avisos, path: /ajustes/notificaciones, permission: notifications.manage_own }
widgets: []
plan_min: base
flag: module.notifications
