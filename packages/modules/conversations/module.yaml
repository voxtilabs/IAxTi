module:
  id: conversations
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations, crm, audit]
  optional: []
permissions:
  - conversations.read
  - conversations.read_all
  - conversations.reply
  - conversations.assign
  - conversations.resolve
  - conversations.notes
  - quickreplies.manage
events:
  publishes:
    - conversation.created
    - conversation.assigned
    - conversation.state_changed
    - message.received
    - message.sent
    - message.failed
    - sla.first_response_breached
    - conversation.unattended
    - conversation.handoff_requested
    - note.mentioned
    - conversation.auto_resolved
    - conversation.archived
    - conversations.retention.purged
    - conversations.retention.scheduled
  consumes:
    - contact.merged
    - tenant.plan_changed
tools:
  - conversations.get_context
  - conversations.suggest_reply
  - conversations.send_reply
  - conversations.set_state
  - conversations.request_handoff
nav:
  - { label: Bandeja, path: /bandeja, permission: conversations.read, grupo: Trabajo }
widgets:
  - { id: conversations.sin_responder, permission: conversations.read }
plan_min: base
flag: module.conversations
