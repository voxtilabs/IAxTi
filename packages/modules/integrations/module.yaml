# integrations (#76, SPEC §24): la otra mitad de la integración junto a la
# API por tenant — sus sistemas reaccionan a lo que pasa en IAxTi sin
# polling. Entregas FIRMADAS, reintentos exponenciales, y un endpoint que
# falla sostenido se apaga con aviso.
module:
  id: integrations
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations, audit, authorization]
  optional: [crm]
permissions:
  - webhooks.manage
  - integrations.read
  - integrations.connect
events:
  publishes:
    - webhook.failed
  # `'*'` no es un evento llamado así: nombra el CATÁLOGO ENTERO. El fan-out de
  # webhooks salientes se registra con `webhookConsumers(registry.eventsCatalog())`
  # (apps/workers/src/main.ts), así que entrega cualquier evento publicado al que
  # el tenant le haya suscrito un endpoint: este módulo consume todo.
  #
  # Decía `[]`, y por eso no se podía responder «¿este evento es huérfano?»: con
  # el único consumidor universal declarado en cero, los eventos publicados que
  # ningún manifiesto dice consumir se leían como eventos que se publican al
  # vacío, y no lo son — son entregables por webhook (#783). Si alguien lo
  # vuelve a `[]`, la cuenta vuelve a mentir y el próximo que la haga va a creer
  # que encontró un hallazgo por cada uno.
  #
  # A propósito sin cifra: la primera versión de este comentario decía «52», que
  # era la cuenta del árbol de ANTES del mismo commit que lo escribió —todavía
  # con `permission.denied` publicado—. Hoy son 51 y mañana son otros. Un número
  # clavado en un comentario envejece sin que nadie lo note; el que quiera la
  # cuenta de hoy la saca de los manifiestos, que es de donde salía.
  consumes: ['*']
tools: [gmail.get_threads]
nav:
  - { label: Webhooks, path: /ajustes/webhooks, permission: webhooks.manage, grupo: Configuración, seccion: Integraciones }
widgets: []
# Se vende desde el plan Crece (`plan_limits`): decía `base` (#834).
plan_min: crece
flag: module.integrations
