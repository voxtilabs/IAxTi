module:
  id: organizations
  version: 0.1.0
  core: true
depends_on:
  required: [identity]
  optional: []
permissions:
  - tenant.read
  - tenant.settings
  - tenant.billing
  - teams.manage
events:
  publishes:
    - tenant.created
    - tenant.plan_changed
    - tenant.state_changed
    - usage.threshold_reached
    - tenant.settings_changed
  consumes:
    # El onboarding avanza con lo que de verdad pasa (SPEC §7, issue del
    # onboarding que no avanzaba): cada paso escucha el evento que lo nombra.
    - tenant.settings_changed
    - channel.connected
    - knowledge.source_added
    - user.invited
    - message.sent
tools: []
nav:
  - { label: Ajustes, path: /ajustes/bandeja, permission: tenant.settings, grupo: Configuración }
widgets: []
plan_min: base
flag: module.organizations
