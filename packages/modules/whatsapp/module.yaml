# whatsapp (#42, SPEC §12): el adaptador Kapso DETRÁS del puerto de
# channels, hablando el vocabulario de la Cloud API de Meta — migrar a Tech
# Provider propio será cambiar solo este adaptador. Kapso SIN lógica de
# negocio: ni flows, ni agentes, ni base gestionada.
module:
  id: whatsapp
  version: 0.1.0
  core: false
depends_on:
  required: [channels, organizations, identity]
  optional: []
permissions:
  - whatsapp.numbers.manage
  - whatsapp.templates.manage
events:
  publishes:
    - template.sent
    - template.status_changed
    - template.submitted
  consumes: []
tools: []
# La pantalla existe desde #44 en la API y recién ahora en la app: sin
# plantillas aprobadas no se le puede escribir a nadie fuera de la ventana
# de 24 h, que es la mitad de para qué sirve el producto.
nav:
  - { label: Plantillas, path: /ajustes/plantillas, permission: whatsapp.templates.manage }
widgets: []
plan_min: base
flag: module.whatsapp
