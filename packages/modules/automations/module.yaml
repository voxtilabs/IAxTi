# automations (#62, SPEC §15): que el seguimiento que hoy no se hace, se
# haga. Disparador (evento o tiempo) + condiciones + acciones — y ningún
# mensaje sale sin consentimiento ni en horario de silencio.
module:
  id: automations
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations, audit]
  optional: [conversations, crm]
permissions:
  - automations.manage
  - automations.read
  - automations.enroll
events:
  publishes:
    - campaign.sent
    - automation.ran
    - automation.failed
    - automation.paused
    - sequence.started
    - sequence.stopped
    - sequence.completed
  consumes:
    - conversation.created
    - conversation.state_changed
    - conversation.assigned
    - deal.created
    - deal.stage_changed
    - agent.escalated
    - message.received
tools: []
nav:
  - { label: Automatizaciones, path: /ajustes/automatizaciones, permission: automations.manage, grupo: Configuración }
  - { label: Campañas, path: /campanas, permission: automations.manage, grupo: Trabajo }
widgets: []
plan_min: base
flag: module.automations
