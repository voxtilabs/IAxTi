# automations (#62, SPEC §15): que el seguimiento que hoy no se hace, se
# haga. Disparador (evento o tiempo) + condiciones + acciones — y ningún
# mensaje sale sin consentimiento ni en horario de silencio.
module:
  id: automations
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations, audit]
  # billing por fx_rates (#990): el costo de la campaña se convierte por día,
  # como reportes (#796) — lectura declarada, dentro de la regla de #784.
  optional: [conversations, crm, billing]
permissions:
  - automations.manage
  - automations.read
  - automations.enroll
events:
  publishes:
    - campaign.sent
    - automation.ran
    - automation.failed
    - automation.paused
    - sequence.started
    - sequence.stopped
    - sequence.completed
  consumes:
    - conversation.created
    - conversation.state_changed
    - conversation.assigned
    - deal.created
    - deal.stage_changed
    - agent.escalated
    - message.received
tools: []
nav:
  - { label: Automatizaciones, path: /ajustes/automatizaciones, permission: automations.manage, grupo: Configuración, seccion: Inteligencia }
# Campañas NO está en el menú (#1167). La pantalla, los endpoints y los
# permisos siguen enteros: lo único que se sacó es la entrada.
#
# Por qué: hasta que haya una plantilla aprobada por Meta y contactos con
# opt-in, `/campanas` se abre vacía, y en un menú que como ADMIN ya no entra
# en 950 px de alto (#1108) cada entrada que no se usa empuja a las que sí.
#
# Para devolverla, descomentar esta línea. No hace falta nada más.
#  - { label: Campañas, path: /campanas, permission: automations.manage, grupo: Trabajo }
widgets: []
# Se vende desde el plan Crece (`plan_limits`): decía `base` (#834).
plan_min: crece
flag: module.automations
