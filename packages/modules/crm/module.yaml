module:
  id: crm
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations]
  optional: []
permissions:
  - crm.contacts.read
  - crm.contacts.create
  - crm.contacts.update
  - crm.contacts.merge
  - crm.titular.manage
  - crm.contacts.export
  - crm.read_all
  - crm.deals.read
  - crm.deals.create
  - crm.deals.update
  - crm.deals.close
  - crm.pipelines.manage
  - crm.companies.read
  - crm.companies.manage
  - crm.tags.manage
  - crm.fields.manage
  - crm.activities.manage
events:
  publishes:
    - contact.created
    - contact.updated
    - contact.merged
    - contact.opted_out
    - deal.created
    - deal.stage_changed
    - deal.won
    - deal.lost
    - deal.stalled
    - activity.due
  consumes: []
tools:
  - crm.find_contact
  - crm.create_contact
  - crm.update_contact
  - crm.create_deal
  - crm.move_deal
  - crm.add_note
  - crm.create_activity
  - crm.get_history
nav:
  - { label: Contactos, path: /contactos, permission: crm.contacts.read, grupo: Clientes }
  # Los campos propios estaban en la API desde #34 sin pantalla, y la ficha
  # ya recibía sus valores sin dibujarlos.
  - { label: Campos, path: /ajustes/campos, permission: crm.fields.manage, grupo: Configuración }
  - { label: Empresas, path: /empresas, permission: crm.companies.read, grupo: Clientes }
  - { label: Etiquetas, path: /ajustes/etiquetas, permission: crm.tags.manage, grupo: Configuración }
  - { label: Oportunidades, path: /oportunidades, permission: crm.deals.read, grupo: Clientes }
widgets:
  - { id: crm.resumen, permission: crm.deals.read }
plan_min: base
flag: module.crm
