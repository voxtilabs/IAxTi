module:
  id: calendar
  version: 0.1.0
  core: false
depends_on:
  required: [organizations, identity, crm, audit]
  optional: [whatsapp, automations]
permissions:
  - calendar.read
  - calendar.connect
  - calendar.book
  - calendar.manage_availability
events:
  publishes:
    - appointment.created
    - appointment.reminder_sent
    - appointment.attended
    - appointment.no_show
    - appointment.cancelled
  consumes: []
tools:
  - calendar.get_slots
  - calendar.book
  - calendar.reschedule
  - calendar.cancel
# Sin `nav` hasta que exista la página.
#
# Declaraba `/agenda` y esa página no está construida: el módulo es
# `plan_min: base` y viene activo, así que el ítem le aparecía en el menú a
# cualquiera con `calendar.read` — y llevaba a un 404. La API de agenda sí
# existe (5 endpoints); lo que falta es la pantalla, y va en #58.
#
# Prometer en el menú algo que no existe es peor que no ofrecerlo: el
# cliente descubre que el producto está a medias haciendo clic.
nav: []
widgets: []
plan_min: base
flag: module.calendar
