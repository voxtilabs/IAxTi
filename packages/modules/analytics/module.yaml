# analytics (#66, SPEC §19): que el dueño sepa cómo va el negocio sin
# configurar un reporte. Todo se agrega POR EVENTO en tablas por día y
# tenant — nada de consultas pesadas en vivo, y ningún número inventado.
module:
  id: analytics
  version: 0.1.0
  core: false
depends_on:
  required: [identity, organizations, audit]
  optional: [conversations, billing]
permissions:
  - analytics.read
  - analytics.read_all
events:
  publishes: []
  consumes:
    - conversation.created
    - conversation.state_changed
    - deal.created
    - deal.won
    - deal.lost
    - agent.executed
    - message.sent
tools:
  # Para el asistente que responde sobre los números (#410). Las tres LEEN.
  # `catalogo` existe para que el modelo no invente nombres de métricas.
  - analytics.metrica
  - analytics.comparar
  - analytics.catalogo
nav:
  - { label: Reportes, path: /reportes, permission: analytics.read, grupo: Trabajo }
widgets: []
# Se vende desde el plan Equipo (`plan_limits`): decía `base` y analítica no viene en el plan más barato (#834).
plan_min: equipo
flag: module.analytics
